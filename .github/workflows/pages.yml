# Publishes all of Common Ground (the lobby and the five prototypes) as a static site on GitHub Pages.
# `bun run build` writes site/ with relative links only, so it works at https://<user>.github.io/<repo>/.
# Pages cannot run the Bun server, so what needs one works differently there (see HANDOFF.md, "GitHub Pages"):
# online play goes peer to peer, and wishes, sealed songs, memories and lent voices stay in each browser.
#
# One-time setup: repo Settings > Pages > Build and deployment > Source: GitHub Actions.

name: Common Ground on Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
